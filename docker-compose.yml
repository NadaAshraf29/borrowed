version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: borrowed_postgres
    restart: always
    environment:
      POSTGRES_USER: borrowed_user
      POSTGRES_PASSWORD: borrowed_password
      POSTGRES_DB: borrowed_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

